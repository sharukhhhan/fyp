name: Deploy Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'  # Запускать только при изменениях в директории backend
      - '.github/workflows/backend-deploy.yml'  # И при изменениях в самом файле workflow
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
      
      - name: Deploy backend to server
        run: |
          # Создание архива только с бэкенд-директорией
          tar -czf backend.tar.gz backend/
          
          # Копирование файлов на сервер
          scp backend.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/backend.tar.gz
          
          # Деплой на сервере
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            # Распаковка архива
            mkdir -p ~/app/backend
            tar -xzf backend.tar.gz -C ~/app
            cd ~/app/backend
            
            # Запуск docker-compose с переменными
            SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            DEBUG="${{ secrets.DEBUG }}" \
            ALLOWED_HOSTS="${{ secrets.ALLOWED_HOSTS }}" \
            DB_NAME="${{ secrets.DB_NAME }}" \
            DB_USER="${{ secrets.DB_USER }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            DB_HOST="${{ secrets.DB_HOST }}" \
            DB_PORT="${{ secrets.DB_PORT }}" \
            EMAIL_HOST="${{ secrets.EMAIL_HOST }}" \
            EMAIL_PORT="${{ secrets.EMAIL_PORT }}" \
            EMAIL_USE_TLS="${{ secrets.EMAIL_USE_TLS }}" \
            EMAIL_HOST_USER="${{ secrets.EMAIL_HOST_USER }}" \
            EMAIL_HOST_PASSWORD="${{ secrets.EMAIL_HOST_PASSWORD }}" \
            DEFAULT_FROM_EMAIL="${{ secrets.DEFAULT_FROM_EMAIL }}" \
            USE_S3="${{ secrets.USE_S3 }}" \
            AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            AWS_STORAGE_BUCKET_NAME="${{ secrets.AWS_STORAGE_BUCKET_NAME }}" \
            AWS_S3_REGION_NAME="${{ secrets.AWS_S3_REGION_NAME }}" \
            FERNET_KEY="${{ secrets.FERNET_KEY }}" \
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            AI_SERVICE_API_URL="${{ secrets.AI_SERVICE_API_URL }}" \
            AI_SERVICE_API_KEY="${{ secrets.AI_SERVICE_API_KEY }}" \
            VIDEO_CONFERENCE_BASE_URL="${{ secrets.VIDEO_CONFERENCE_BASE_URL }}" \
            VIDEO_CONFERENCE_DOMAIN="${{ secrets.VIDEO_CONFERENCE_DOMAIN }}" \
            VIDEO_CONFERENCE_SECRET="${{ secrets.VIDEO_CONFERENCE_SECRET }}" \
            SERVER_PORT=${SERVER_PORT:-8080} \
            docker-compose down
            
            SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            DEBUG="${{ secrets.DEBUG }}" \
            ALLOWED_HOSTS="${{ secrets.ALLOWED_HOSTS }}" \
            DB_NAME="${{ secrets.DB_NAME }}" \
            DB_USER="${{ secrets.DB_USER }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            DB_HOST="${{ secrets.DB_HOST }}" \
            DB_PORT="${{ secrets.DB_PORT }}" \
            EMAIL_HOST="${{ secrets.EMAIL_HOST }}" \
            EMAIL_PORT="${{ secrets.EMAIL_PORT }}" \
            EMAIL_USE_TLS="${{ secrets.EMAIL_USE_TLS }}" \
            EMAIL_HOST_USER="${{ secrets.EMAIL_HOST_USER }}" \
            EMAIL_HOST_PASSWORD="${{ secrets.EMAIL_HOST_PASSWORD }}" \
            DEFAULT_FROM_EMAIL="${{ secrets.DEFAULT_FROM_EMAIL }}" \
            USE_S3="${{ secrets.USE_S3 }}" \
            AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            AWS_STORAGE_BUCKET_NAME="${{ secrets.AWS_STORAGE_BUCKET_NAME }}" \
            AWS_S3_REGION_NAME="${{ secrets.AWS_S3_REGION_NAME }}" \
            FERNET_KEY="${{ secrets.FERNET_KEY }}" \
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            AI_SERVICE_API_URL="${{ secrets.AI_SERVICE_API_URL }}" \
            AI_SERVICE_API_KEY="${{ secrets.AI_SERVICE_API_KEY }}" \
            VIDEO_CONFERENCE_BASE_URL="${{ secrets.VIDEO_CONFERENCE_BASE_URL }}" \
            VIDEO_CONFERENCE_DOMAIN="${{ secrets.VIDEO_CONFERENCE_DOMAIN }}" \
            VIDEO_CONFERENCE_SECRET="${{ secrets.VIDEO_CONFERENCE_SECRET }}" \
            SERVER_PORT=${SERVER_PORT:-8080} \
            docker-compose up -d --build
            
            # Очистка
            docker image prune -f
          EOF